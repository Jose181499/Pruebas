{% extends "base.html" %}
{% block title %}Recuentos de Inventario{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold">🔢 Recuentos Físicos de Inventario</h1>
        <a href="/inventario" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div class="row g-4">
        <!-- Formulario de Recuento -->
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-dark text-white rounded-top-4">
                    <i class="bi bi-clipboard-check"></i> Registrar Recuento
                </div>
                <div class="card-body">
                    <form id="formRecuento">
                        <div class="mb-3">
                            <label class="form-label">Producto</label>
                            <select class="form-select" id="producto_id" required>
                                <option value="">Seleccione producto</option>
                                {% for p in productos %}
                                <option value="{{ p.id }}">{{ p.codigo }} - {{ p.descripcion }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Stock en Sistema</label>
                            <input type="text" class="form-control" id="stock_sistema" readonly style="background:#f3f4f6;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cantidad Física Contada</label>
                            <input type="number" class="form-control" id="cantidad_fisica" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Diferencia</label>
                            <input type="text" class="form-control" id="diferencia" readonly style="background:#f3f4f6;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ubicación</label>
                            <input type="text" class="form-control" id="ubicacion" placeholder="Estante, rack, posición">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Observaciones</label>
                            <textarea class="form-control" id="observaciones" rows="2"></textarea>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="aplicar_ajuste">
                            <label class="form-check-label">
                                Aplicar ajuste automático al stock
                            </label>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">📋 Registrar Recuento</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Historial de Recuentos -->
        <div class="col-md-7">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-primary text-white rounded-top-4">
                    <i class="bi bi-clock-history"></i> Historial de Recuentos
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-primary">
                            <tr>
                                <th>Fecha</th>
                                <th>Producto</th>
                                <th>Sistema</th>
                                <th>Físico</th>
                                <th>Diferencia</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="recuentosBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Cargar stock del sistema
document.getElementById('producto_id').addEventListener('change', async function() {
    const productoId = this.value;
    if (!productoId) return;
    
    const response = await fetch(`/inventario/api/stock/${productoId}`);
    const data = await response.json();
    
    if (data.success) {
        document.getElementById('stock_sistema').value = data.stock_actual;
        calcularDiferencia();
    }
});

// Calcular diferencia
function calcularDiferencia() {
    const stockSistema = parseFloat(document.getElementById('stock_sistema').value) || 0;
    const cantidadFisica = parseFloat(document.getElementById('cantidad_fisica').value) || 0;
    const diferencia = cantidadFisica - stockSistema;
    document.getElementById('diferencia').value = diferencia;
    const diffElement = document.getElementById('diferencia');
    
    if (diferencia > 0) {
        diffElement.style.color = 'green';
        diffElement.style.fontWeight = 'bold';
    } else if (diferencia < 0) {
        diffElement.style.color = 'red';
        diffElement.style.fontWeight = 'bold';
    } else {
        diffElement.style.color = 'black';
    }
}

document.getElementById('cantidad_fisica').addEventListener('input', calcularDiferencia);

// Registrar recuento
document.getElementById('formRecuento').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const data = {
        producto_id: document.getElementById('producto_id').value,
        cantidad_fisica: document.getElementById('cantidad_fisica').value,
        ubicacion: document.getElementById('ubicacion').value,
        observaciones: document.getElementById('observaciones').value,
        aplicar_ajuste: document.getElementById('aplicar_ajuste').checked
    };
    
    const response = await fetch('/inventario/api/recuento', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    
    const result = await response.json();
    if (result.success) {
        alert('✅ Recuento registrado correctamente');
        cargarRecuentos();
        this.reset();
    } else {
        alert('❌ Error: ' + result.error);
    }
});

async function cargarRecuentos() {
    const response = await fetch('/inventario/api/recuentos/historial');
    const data = await response.json();
    
    if (data.success) {
        const tbody = document.getElementById('recuentosBody');
        tbody.innerHTML = '';
        data.data.forEach(r => {
            const diff = r.diferencia;
            const diffClass = diff > 0 ? 'text-success' : (diff < 0 ? 'text-danger' : '');
            const estado = diff === 0 ? '✅ Correcto' : (diff > 0 ? '📈 Sobrante' : '📉 Faltante');
            const estadoClass = diff === 0 ? 'bg-success' : (diff > 0 ? 'bg-warning' : 'bg-danger');
            
            tbody.innerHTML += `
                <tr>
                    <td>${r.fecha}</td>
                    <td>${r.producto_nombre}</td>
                    <td>${r.stock_sistema}</td>
                    <td>${r.cantidad_fisica}</td>
                    <td class="${diffClass} fw-bold">${diff > 0 ? '+' : ''}${diff}</td>
                    <td><span class="badge ${estadoClass} text-white">${estado}</span></td>
                </tr>
            `;
        });
    }
}
cargarRecuentos();
</script>
{% endblock %}
