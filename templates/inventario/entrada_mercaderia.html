{% extends "base.html" %}
{% block title %}Entrada de Mercadería{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold">📥 Entrada de Mercadería</h1>
        <a href="/inventario" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-info text-white rounded-top-4">
            <i class="bi bi-plus-circle"></i> Registrar Ingreso
        </div>
        <div class="card-body">
            <form id="formEntrada">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Producto</label>
                        <select class="form-select" id="producto_id" required>
                            <option value="">Seleccione producto</option>
                            {% for p in productos %}
                            <option value="{{ p.id }}">{{ p.codigo }} - {{ p.descripcion }} ({{ p.marca }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Cantidad</label>
                        <input type="number" class="form-control" id="cantidad" step="0.01" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Costo Unitario</label>
                        <input type="number" class="form-control" id="costo" step="0.01" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Documento Referencia</label>
                        <input type="text" class="form-control" id="documento" placeholder="Factura N°...">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Proveedor</label>
                        <input type="text" class="form-control" id="proveedor" placeholder="Nombre del proveedor">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Observaciones</label>
                        <textarea class="form-control" id="observaciones" rows="2"></textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">✅ Registrar Entrada</button>
                        <button type="reset" class="btn btn-secondary">Limpiar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('formEntrada').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const data = {
        producto_id: document.getElementById('producto_id').value,
        cantidad: document.getElementById('cantidad').value,
        costo_unitario: document.getElementById('costo').value,
        documento: document.getElementById('documento').value,
        proveedor: document.getElementById('proveedor').value,
        observaciones: document.getElementById('observaciones').value
    };
    
    const response = await fetch('/inventario/api/movimiento/entrada', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    
    const result = await response.json();
    if (result.success) {
        alert('✅ Entrada registrada correctamente');
        this.reset();
    } else {
        alert('❌ Error: ' + result.error);
    }
});
</script>
{% endblock %}
