{% extends "base.html" %}
{% block title %}Salida de Mercadería{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold">📤 Salida de Mercadería</h1>
        <a href="/inventario" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-danger text-white rounded-top-4">
            <i class="bi bi-dash-circle"></i> Registrar Salida
        </div>
        <div class="card-body">
            <form id="formSalida">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Producto</label>
                        <select class="form-select" id="producto_id" required>
                            <option value="">Seleccione producto</option>
                            {% for p in productos %}
                            <option value="{{ p.id }}" data-stock="0">{{ p.codigo }} - {{ p.descripcion }} ({{ p.marca }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Stock Actual</label>
                        <input type="text" class="form-control" id="stock_actual" readonly style="background:#f3f4f6;">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Cantidad a Salir</label>
                        <input type="number" class="form-control" id="cantidad" step="0.01" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Motivo de Salida</label>
                        <select class="form-select" id="motivo" required>
                            <option value="">Seleccione motivo</option>
                            <option value="VENTA">Venta</option>
                            <option value="DEVOLUCION">Devolución</option>
                            <option value="PERDIDA">Pérdida / Merma</option>
                            <option value="TRANSFERENCIA">Transferencia</option>
                            <option value="MUESTRA">Muestra / Obsequio</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Documento Referencia</label>
                        <input type="text" class="form-control" id="documento" placeholder="Comprobante N°...">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Cliente / Destino</label>
                        <input type="text" class="form-control" id="destino" placeholder="Nombre del cliente o destino">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Observaciones</label>
                        <textarea class="form-control" id="observaciones" rows="2"></textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-danger">✅ Registrar Salida</button>
                        <button type="reset" class="btn btn-secondary">Limpiar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Cargar stock actual al seleccionar producto
document.getElementById('producto_id').addEventListener('change', async function() {
    const productoId = this.value;
    if (!productoId) return;
    
    const response = await fetch(`/inventario/api/stock/${productoId}`);
    const data = await response.json();
    
    if (data.success) {
        document.getElementById('stock_actual').value = data.stock_actual;
        document.getElementById('stock_actual').style.color = data.stock_actual <= 0 ? 'red' : 'green';
    }
});

document.getElementById('formSalida').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const stockActual = parseFloat(document.getElementById('stock_actual').value) || 0;
    const cantidad = parseFloat(document.getElementById('cantidad').value) || 0;
    
    if (cantidad > stockActual) {
        alert('❌ Error: No hay suficiente stock. Stock disponible: ' + stockActual);
        return;
    }
    
    const data = {
        producto_id: document.getElementById('producto_id').value,
        cantidad: cantidad,
        motivo: document.getElementById('motivo').value,
        documento: document.getElementById('documento').value,
        destino: document.getElementById('destino').value,
        observaciones: document.getElementById('observaciones').value
    };
    
    const response = await fetch('/inventario/api/movimiento/salida', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    
    const result = await response.json();
    if (result.success) {
        alert('✅ Salida registrada correctamente');
        location.reload();
    } else {
        alert('❌ Error: ' + result.error);
    }
});
</script>
{% endblock %}
