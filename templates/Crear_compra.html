<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Orden de Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3>Nueva Orden de Compra</h3>
            </div>
            <div class="card-body">
                <p><strong>Modo:</strong> {{ modo }}</p>
                <p><strong>Órdenes Recientes:</strong> {{ ordenes|length }}</p>
                
                <div class="alert alert-info">
                    <h5>Órdenes existentes:</h5>
                    <ul>
                    {% for orden in ordenes %}
                        <li>{{ orden.codigo_orden }} - {{ orden.proveedor }} - {{ orden.estado }}</li>
                    {% endfor %}
                    </ul>
                </div>
                
                <a href="/compras" class="btn btn-secondary">Volver al Listado</a>
            </div>
        </div>
    </div>
</body>
</html>
