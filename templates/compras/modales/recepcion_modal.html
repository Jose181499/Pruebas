<!-- MODAL RECEPCIÓN DE MERCADERÍA -->
<div class="modal-bg" id="recepcionModal">
    <div class="modal-box" style="width:min(1000px,96vw); max-height:85vh;">
        <div class="modal-head">
            <div class="modal-title" id="recepcionModalTitle">📦 Nueva recepción de mercadería</div>
            <button class="btn btn-secondary" style="background:transparent;color:#fff;border-color:#fff;padding:6px 14px;min-height:34px;border-radius:14px" onclick="closeModal('recepcionModal')">✕ Cerrar</button>
        </div>
        <div class="modal-body" id="recepcionForm">
            <div class="ficha-section">
                <div class="ficha-section-title">Datos de recepción</div>
                <div class="ficha-grid">
                    <div class="form-field col-3">
                        <label>N° Recepción</label>
                        <input id="recNumero" placeholder="REC-20260713-0001">
                    </div>
                    <div class="form-field col-3">
                        <label>Fecha recepción</label>
                        <input id="recFecha" type="date">
                    </div>
                    <div class="form-field col-3">
                        <label>Orden de compra</label>
                        <input id="recOrden" placeholder="OC-20260713-0001">
                    </div>
                    <div class="form-field col-3">
                        <label>Proveedor</label>
                        <input id="recProveedor" placeholder="Nombre del proveedor">
                    </div>
                    <div class="form-field col-4">
                        <label>Producto</label>
                        <input id="recProducto" placeholder="Descripción del producto">
                    </div>
                    <div class="form-field col-2">
                        <label>Cantidad recibida</label>
                        <input id="recCantidad" type="number" value="1">
                    </div>
                    <div class="form-field col-2">
                        <label>Unidad</label>
                        <select id="recUnidad">
                            <option value="UND">UND</option>
                            <option value="KG">KG</option>
                            <option value="LTS">LTS</option>
                            <option value="MTS">MTS</option>
                        </select>
                    </div>
                    <div class="form-field col-4">
                        <label>Estado de mercadería</label>
                        <select id="recEstadoMercaderia">
                            <option value="Buen estado">Buen estado</option>
                            <option value="Con observaciones">Con observaciones</option>
                            <option value="Dañado">Dañado</option>
                            <option value="Incompleto">Incompleto</option>
                        </select>
                    </div>
                    <div class="form-field col-6">
                        <label>Observaciones</label>
                        <textarea id="recObs" placeholder="Detalles de la recepción..." rows="2"></textarea>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-foot">
            <button class="btn btn-secondary" onclick="closeModal('recepcionModal')">Cancelar</button>
            <button class="btn btn-soft" onclick="saveRecepcion('Pendiente')">💾 Guardar pendiente</button>
            <button class="btn btn-primary" onclick="saveRecepcion('Aprobada')">✅ Aprobar recepción</button>
        </div>
    </div>
</div>
