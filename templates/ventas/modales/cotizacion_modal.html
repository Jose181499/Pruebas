<!-- MODAL COTIZACIÓN - MÁS ALTO Y SIN SCROLL -->
<div class="modal-bg" id="cotizacionModal">
    <div class="modal-box" style="width:min(1540px,98vw); height:95vh; max-height:95vh; display:flex; flex-direction:column; margin:0;">
        <!-- HEADER - Compacto -->
        <div class="modal-head" style="padding:4px 16px; min-height:32px; max-height:36px; height:36px; flex-shrink:0; background:#0F172A; display:flex; align-items:center; justify-content:space-between;">
            <div class="modal-title" id="cotizacionModalTitle" style="font-size:14px; font-weight:900; color:#fff;">Nueva cotización</div>
            <button class="btn btn-secondary" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); color:#fff; padding:2px 12px; min-height:24px; border-radius:6px; font-weight:700; font-size:10px; cursor:pointer;" onclick="closeModal('cotizacionModal')">✕ Cerrar</button>
        </div>
        
        <!-- BODY - Ocupa TODO el espacio disponible -->
        <div class="modal-body" id="cotizacionForm" style="flex:1 1 auto; overflow:auto; padding:8px 14px 4px 14px; background:#F8FAFC; margin:0;">
            <!-- Contenido dinámico generado por JavaScript -->
        </div>
        
        <!-- FOOTER - Compacto -->
        <div class="modal-foot" style="padding:4px 16px; min-height:32px; max-height:36px; height:36px; flex-shrink:0; background:#FFFFFF; border-top:1px solid #E5E7EB; display:flex; align-items:center; justify-content:flex-end; gap:6px; margin:0;">
            <button class="btn btn-secondary" style="height:24px; min-height:24px; max-height:24px; padding:0 14px; font-size:10px; border-radius:6px; border:1px solid #E5E7EB; background:#F1F5F9; color:#0F172A; cursor:pointer; display:inline-flex; align-items:center; gap:4px;" onclick="closeModal('cotizacionModal')">Cancelar</button>
            <button class="btn btn-soft" style="height:24px; min-height:24px; max-height:24px; padding:0 14px; font-size:10px; border-radius:6px; border:1px solid #E5E7EB; background:#F8FAFC; color:#334155; cursor:pointer; display:inline-flex; align-items:center; gap:4px;" onclick="saveCotizacionDraft()">💾 Guardar</button>
            <button class="btn btn-blue" style="height:24px; min-height:24px; max-height:24px; padding:0 14px; font-size:10px; border-radius:6px; border:none; background:#2563EB; color:#fff; cursor:pointer; display:inline-flex; align-items:center; gap:4px;" onclick="sendCotizacionToReview()">📤 Revisión</button>
            <button class="btn btn-green" style="height:24px; min-height:24px; max-height:24px; padding:0 14px; font-size:10px; border-radius:6px; border:none; background:#16A34A; color:#fff; cursor:pointer; display:inline-flex; align-items:center; gap:4px;" onclick="generateCotizacionPdfAndSend()">📄 Generar</button>
        </div>
    </div>
</div>
