<!-- MODAL COTIZACIÓN - VERSIÓN MAXIMIZADA -->
<div class="modal-bg" id="cotizacionModal" style="align-items: flex-start; padding: 8px; z-index: 99999;">
    <div class="modal-box" style="width: 98.5vw; max-height: calc(100vh - 16px); height: calc(100vh - 16px); margin: 0 auto; display: flex; flex-direction: column; border-radius: 12px;">
        <!-- HEADER ULTRA COMPACTO -->
        <div class="modal-head" style="padding: 4px 14px; min-height: 32px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.08); background: #0F172A;">
            <div class="modal-title" id="cotizacionModalTitle" style="font-weight: 400; font-size: 0.95rem; line-height: 1.1; margin: 0; padding: 0; color: #fff;">Nueva cotización</div>
            <button class="btn btn-secondary" style="background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.15);padding:3px 10px;min-height:24px;border-radius:10px;font-size:0.75rem;line-height:1.2;cursor:pointer;" onclick="closeModal('cotizacionModal')">✕ Cerrar</button>
        </div>
        
        <!-- BODY - OCUPA CASI TODO EL ESPACIO -->
        <div class="modal-body" id="cotizacionForm" style="flex: 1; overflow-y: auto; padding: 8px 12px; min-height: 0; background: #F8FAFC;">
            <!-- Contenido dinámico generado por JavaScript -->
        </div>
        
        <!-- FOOTER ULTRA COMPACTO -->
        <div class="modal-foot" style="padding: 3px 12px; gap: 4px; display: flex; align-items: center; justify-content: flex-end; flex-shrink: 0; border-top: 1px solid rgba(0,0,0,0.06); background: #FFFFFF; flex-wrap: wrap; min-height: 34px;">
            <button class="btn btn-secondary" style="padding:3px 10px;font-size:0.75rem;line-height:1.2;min-height:24px;border-radius:8px;border:1px solid #E5E7EB;background:#F8FAFC;color:#0F172A;cursor:pointer;" onclick="closeModal('cotizacionModal')">Cancelar</button>
            <button class="btn btn-soft" style="padding:3px 10px;font-size:0.75rem;line-height:1.2;min-height:24px;border-radius:8px;border:1px solid #E5E7EB;background:#F8FAFC;color:#334155;cursor:pointer;" onclick="saveCotizacionDraft()">💾 Guardar borrador</button>
            <button class="btn btn-blue" style="padding:3px 10px;font-size:0.75rem;line-height:1.2;min-height:24px;border-radius:8px;background:#2563EB;color:#fff;border:none;cursor:pointer;" onclick="sendCotizacionToReview()">📤 Enviar a revisión</button>
            <button class="btn btn-green" style="padding:3px 10px;font-size:0.75rem;line-height:1.2;min-height:24px;border-radius:8px;background:#16A34A;color:#fff;border:none;cursor:pointer;" onclick="generateCotizacionPdfAndSend()">📄 Generar cotización</button>
        </div>
    </div>
</div>
