<!-- MODAL COTIZACIÓN - VERSIÓN COMPACTA -->
<div class="modal-bg" id="cotizacionModal">
    <div class="modal-box" style="width:min(98vw, 98vw); max-width:98vw; height:95vh; max-height:95vh;">
        <div class="modal-head" style="padding:4px 16px; min-height:32px; flex-shrink:0; background:#0F172A; display:flex; align-items:center; justify-content:space-between;">
            <div class="modal-title" id="cotizacionModalTitle" style="font-size:14px; font-weight:900; color:#fff;">Nueva cotización</div>
            <button class="btn btn-secondary" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); color:#fff; padding:2px 10px; min-height:22px; border-radius:5px; font-weight:700; font-size:10px; cursor:pointer;" onclick="closeModal('cotizacionModal')">✕ Cerrar</button>
        </div>
        <div class="modal-body" id="cotizacionForm" style="flex:1 1 auto; overflow:auto; padding:6px 12px; background:#F8FAFC;">
            <!-- Contenido dinámico generado por JavaScript -->
        </div>
        <!-- 🔽 FOOTER ULTRA COMPACTO - SIN ESTILOS INLINE CONFLICTIVOS -->
        <div class="modal-foot" style="padding:2px 12px; min-height:26px; max-height:30px; flex-shrink:0; background:#FFFFFF; border-top:1px solid #E5E7EB; display:flex; align-items:center; justify-content:flex-end; gap:4px;">
            <button class="btn btn-secondary" style="height:20px; padding:0 8px; font-size:9px; border-radius:4px; border:1px solid #E5E7EB; background:#F1F5F9; color:#0F172A; cursor:pointer; display:inline-flex; align-items:center; gap:3px;" onclick="closeModal('cotizacionModal')">Cancelar</button>
            <button class="btn btn-soft" style="height:20px; padding:0 8px; font-size:9px; border-radius:4px; border:1px solid #E5E7EB; background:#F8FAFC; color:#334155; cursor:pointer; display:inline-flex; align-items:center; gap:3px;" onclick="saveCotizacionDraft()">💾 Guardar borrador</button>
            <button class="btn btn-blue" style="height:20px; padding:0 8px; font-size:9px; border-radius:4px; border:none; background:#2563EB; color:#fff; cursor:pointer; display:inline-flex; align-items:center; gap:3px;" onclick="sendCotizacionToReview()">📤 Enviar a revisión</button>
            <button class="btn btn-green" style="height:20px; padding:0 8px; font-size:9px; border-radius:4px; border:none; background:#16A34A; color:#fff; cursor:pointer; display:inline-flex; align-items:center; gap:3px;" onclick="generateCotizacionPdfAndSend()">📄 Generar cotización</button>
        </div>
    </div>
</div>
