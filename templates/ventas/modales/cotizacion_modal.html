<!-- MODAL COTIZACIÓN -->
<div class="modal-bg" id="cotizacionModal">
    <div class="modal-box" style="width:min(1540px,98vw)">
        <div class="modal-head" style="padding: 6px 16px; min-height: 36px;">
            <div class="modal-title" id="cotizacionModalTitle" style="font-weight: 400; font-size: 1rem; line-height: 1.2;">Nueva cotización</div>
            <button class="btn btn-secondary" style="background:transparent;color:#fff;border-color:#fff;padding:4px 12px;min-height:28px;border-radius:14px;font-size:0.85rem;" onclick="closeModal('cotizacionModal')">✕ Cerrar</button>
        </div>
        <div class="modal-body" id="cotizacionForm">
            <!-- Contenido dinámico generado por JavaScript -->
        </div>
        <div class="modal-foot" style="padding: 6px 16px; gap: 6px;">
            <button class="btn btn-secondary" style="padding:4px 12px;font-size:0.85rem;" onclick="closeModal('cotizacionModal')">Cancelar</button>
            <button class="btn btn-soft" style="padding:4px 12px;font-size:0.85rem;" onclick="saveCotizacionDraft()">💾 Guardar borrador</button>
            <button class="btn btn-blue" style="padding:4px 12px;font-size:0.85rem;" onclick="sendCotizacionToReview()">📤 Enviar a revisión</button>
            <button class="btn btn-green" style="padding:4px 12px;font-size:0.85rem;" onclick="generateCotizacionPdfAndSend()">📄 Generar cotización</button>
        </div>
    </div>
</div>
