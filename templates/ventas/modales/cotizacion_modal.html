<!-- MODAL COTIZACIÓN OPTIMIZADO -->
<div class="modal-bg" id="cotizacionModal" style="align-items: flex-start; padding-top: 10px;">
    <div class="modal-box" style="width:min(1540px,95vw); max-height: calc(100vh - 30px); margin: 0 auto; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden;">
        
        <!-- HEADER MÁS COMPACTO -->
        <div class="modal-head" style="padding: 4px 14px; min-height: 32px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; background: rgba(0,0,0,0.03); border-bottom: 1px solid rgba(0,0,0,0.06);">
            <span class="modal-title" id="cotizacionModalTitle" style="font-weight: 500; font-size: 0.95rem; line-height: 1.1; margin: 0; letter-spacing: -0.01em;">Nueva cotización</span>
            <button class="btn btn-secondary" style="background:transparent;color:#666;border:1px solid #ddd;padding:2px 10px;min-height:26px;border-radius:20px;font-size:0.8rem;line-height:1.1;transition:all 0.15s;" onmouseover="this.style.background='#f5f5f5'" onmouseout="this.style.background='transparent'" onclick="closeModal('cotizacionModal')">✕ Cerrar</button>
        </div>
        
        <!-- BODY OPTIMIZADO -->
        <div class="modal-body" id="cotizacionForm" style="flex: 1; overflow-y: auto; padding: 12px 16px; min-height: 0; scroll-behavior: smooth;">
            <!-- Contenido dinámico generado por JavaScript -->
        </div>
        
        <!-- FOOTER COMPACTO CON BOTONES MEJORADOS -->
        <div class="modal-foot" style="padding: 4px 14px; gap: 4px; display: flex; align-items: center; justify-content: flex-end; flex-shrink: 0; background: rgba(0,0,0,0.02); border-top: 1px solid rgba(0,0,0,0.06); flex-wrap: wrap;">
            <button class="btn btn-secondary" style="padding:2px 10px;font-size:0.8rem;line-height:1.1;min-height:28px;border-radius:6px;border:1px solid #ddd;background:transparent;color:#555;" onclick="closeModal('cotizacionModal')">Cancelar</button>
            <button class="btn btn-soft" style="padding:2px 10px;font-size:0.8rem;line-height:1.1;min-height:28px;border-radius:6px;border:1px solid #e0e0e0;background:#f8f9fa;color:#333;" onclick="saveCotizacionDraft()">💾 Guardar</button>
            <button class="btn btn-blue" style="padding:2px 10px;font-size:0.8rem;line-height:1.1;min-height:28px;border-radius:6px;border:1px solid #0d6efd;background:#0d6efd;color:#fff;" onclick="sendCotizacionToReview()">📤 Revisión</button>
            <button class="btn btn-green" style="padding:2px 10px;font-size:0.8rem;line-height:1.1;min-height:28px;border-radius:6px;border:1px solid #198754;background:#198754;color:#fff;" onclick="generateCotizacionPdfAndSend()">📄 Generar</button>
        </div>
    </div>
</div>
