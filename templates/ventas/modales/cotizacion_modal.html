<!-- MODAL COTIZACIÓN OPTIMIZADO -->
<div class="modal-bg" id="cotizacionModal" style="align-items: flex-start; padding-top: 10px;">
    <div class="modal-box" style="width:min(1540px,95vw); max-height: calc(100vh - 30px); margin: 0 auto; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden;">
        
        <!-- HEADER - AHORA CON FONDO OSCURO (AZUL/#0F172A) -->
        <div class="modal-head" style="padding: 8px 16px; min-height: 40px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; background: #0F172A; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <span class="modal-title" id="cotizacionModalTitle" style="font-weight: 600; font-size: 1rem; line-height: 1.2; margin: 0; color: #fff; letter-spacing: -0.01em;">Nueva cotización</span>
            <button class="btn btn-secondary" style="background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:4px 14px;min-height:28px;border-radius:20px;font-size:0.8rem;line-height:1.1;transition:all 0.15s;cursor:pointer;" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.12)'" onclick="closeModal('cotizacionModal')">✕ Cerrar</button>
        </div>
        
        <!-- BODY OPTIMIZADO -->
        <div class="modal-body" id="cotizacionForm" style="flex: 1; overflow-y: auto; padding: 12px 16px; min-height: 0; scroll-behavior: smooth; background: #F8FAFC;">
            <!-- Contenido dinámico generado por JavaScript -->
        </div>
        
        <!-- FOOTER COMPACTO CON BOTONES MEJORADOS -->
        <div class="modal-foot" style="padding: 6px 14px; gap: 6px; display: flex; align-items: center; justify-content: flex-end; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E5E7EB; flex-wrap: wrap;">
            <!-- Cancelar - Plomo -->
            <button class="btn btn-secondary" style="padding:4px 14px;font-size:0.8rem;line-height:1.2;min-height:30px;border-radius:8px;border:1px solid #9CA3AF;background:#6B7280;color:#fff;font-weight:800;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background='#4B5563'" onmouseout="this.style.background='#6B7280'" onclick="closeModal('cotizacionModal')">Cancelar</button>
            
            <!-- Validado por Hellen - Azul bajito fluorescente -->
            <button class="btn btn-blue" style="padding:4px 14px;font-size:0.8rem;line-height:1.2;min-height:30px;border-radius:8px;border:1px solid #4FC3F7;background:#4FC3F7;color:#01579B;font-weight:900;cursor:pointer;transition:all 0.2s;box-shadow:0 0 20px rgba(79,195,247,0.4);" onmouseover="this.style.background='#81D4FA';this.style.boxShadow='0 0 30px rgba(79,195,247,0.6)'" onmouseout="this.style.background='#4FC3F7';this.style.boxShadow='0 0 20px rgba(79,195,247,0.4)'" onclick="validateByHellen()">✅ Validado por Hellen</button>
            
            <!-- Revisión - Azul -->
            <button class="btn btn-blue" style="padding:4px 14px;font-size:0.8rem;line-height:1.2;min-height:30px;border-radius:8px;border:1px solid #0d6efd;background:#0d6efd;color:#fff;font-weight:900;cursor:pointer;transition:all 0.2s;box-shadow:0 0 15px rgba(13,110,253,0.3);" onmouseover="this.style.background='#0b5ed7';this.style.boxShadow='0 0 25px rgba(13,110,253,0.5)'" onmouseout="this.style.background='#0d6efd';this.style.boxShadow='0 0 15px rgba(13,110,253,0.3)'" onclick="sendCotizacionToReview()">📤 Revisión</button>
            
            <!-- Generar - Verde fluorescente NEON -->
            <button class="btn btn-green" style="padding:4px 14px;font-size:0.8rem;line-height:1.2;min-height:30px;border-radius:8px;border:1px solid #00FF41;background:#00FF41;color:#000;font-weight:900;cursor:pointer;transition:all 0.2s;box-shadow:0 0 25px rgba(0,255,65,0.5);" onmouseover="this.style.background='#44FF77';this.style.boxShadow='0 0 35px rgba(0,255,65,0.7)'" onmouseout="this.style.background='#00FF41';this.style.boxShadow='0 0 25px rgba(0,255,65,0.5)'" onclick="generateCotizacionPdfAndSend()">📄 Generar</button>
        </div>
    </div>
</div>
