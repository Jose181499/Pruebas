<!-- MODAL COTIZACIÓN - VERSIÓN COMPACTA -->
<div class="modal-bg" id="cotizacionModal">
    <div class="modal-box" style="width:min(98vw, 98vw); max-width:98vw; height:95vh; max-height:95vh;">
        <div class="modal-head" style="padding:6px 16px; min-height:36px; flex-shrink:0;">
            <div class="modal-title" id="cotizacionModalTitle" style="font-size:15px; font-weight:900;">Nueva cotización</div>
            <button class="btn btn-secondary" style="background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:4px 12px; min-height:24px; border-radius:6px; font-weight:800; font-size:11px;" onclick="closeModal('cotizacionModal')">✕ Cerrar</button>
        </div>
        <div class="modal-body" id="cotizacionForm" style="flex:1 1 auto; overflow:auto; padding:6px 12px; background:#F8FAFC;">
            <!-- Contenido dinámico generado por JavaScript -->
        </div>
        <div class="modal-foot" style="padding:4px 16px; min-height:38px; flex-shrink:0; background:#FFFFFF; border-top:1px solid #E5E7EB; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-secondary" style="height:28px; padding:0 12px; font-size:10px; border-radius:6px;" onclick="closeModal('cotizacionModal')">Cancelar</button>
            <button class="btn btn-soft" style="height:28px; padding:0 12px; font-size:10px; border-radius:6px;" onclick="saveCotizacionDraft()">💾 Guardar borrador</button>
            <button class="btn btn-blue" style="height:28px; padding:0 12px; font-size:10px; border-radius:6px;" onclick="sendCotizacionToReview()">📤 Enviar a revisión</button>
            <button class="btn btn-green" style="height:28px; padding:0 12px; font-size:10px; border-radius:6px;" onclick="generateCotizacionPdfAndSend()">📄 Generar cotización</button>
        </div>
    </div>
</div>
