<!-- MODAL COTIZACIÓN -->
<div class="modal-bg" id="cotizacionModal" style="align-items: flex-start; padding-top: 20px; z-index: 99999;">
    <div class="modal-box" style="width:min(1540px,98vw); max-height: calc(100vh - 40px); margin: 0 auto; display: flex; flex-direction: column;">
        <!-- HEADER COMPACTO -->
        <div class="modal-head" style="padding: 6px 16px; min-height: 36px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <div class="modal-title" id="cotizacionModalTitle" style="font-weight: 400; font-size: 1rem; line-height: 1.2; margin: 0; padding: 0;">Nueva cotización</div>
            <button class="btn btn-secondary" style="background:transparent;color:#fff;border-color:#fff;padding:4px 12px;min-height:28px;border-radius:14px;font-size:0.85rem;line-height:1.2;" onclick="closeModal('cotizacionModal')">✕ Cerrar</button>
        </div>
        
        <!-- BODY EXPANDIDO - ocupa todo el espacio disponible -->
        <div class="modal-body" id="cotizacionForm" style="flex: 1; overflow-y: auto; padding: 12px 16px; min-height: 0;">
            <!-- Contenido dinámico generado por JavaScript -->
        </div>
        
        <!-- FOOTER COMPACTO -->
        <div class="modal-foot" style="padding: 4px 12px; gap: 4px; display: flex; align-items: center; justify-content: flex-end; flex-shrink: 0; border-top: 1px solid rgba(255,255,255,0.1); flex-wrap: wrap;">
            <button class="btn btn-secondary" style="padding:3px 10px;font-size:0.8rem;line-height:1.2;min-height:26px;" onclick="closeModal('cotizacionModal')">Cancelar</button>
            <button class="btn btn-soft" style="padding:3px 10px;font-size:0.8rem;line-height:1.2;min-height:26px;" onclick="saveCotizacionDraft()">💾 Guardar borrador</button>
            <button class="btn btn-blue" style="padding:3px 10px;font-size:0.8rem;line-height:1.2;min-height:26px;" onclick="sendCotizacionToReview()">📤 Enviar a revisión</button>
            <button class="btn btn-green" style="padding:3px 10px;font-size:0.8rem;line-height:1.2;min-height:26px;" onclick="generateCotizacionPdfAndSend()">📄 Generar cotización</button>
        </div>
    </div>
</div>
